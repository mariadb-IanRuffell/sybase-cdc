ignite {
  network {
    port = 3344
    nodeFinder.netClusterNodes = ["gridgain1:3344", "gridgain2:3344", "gridgain3:3344"]
  }
  clientConnector {
    sendServerExceptionStackTraceToClient = true
  }
  # Without an explicit size the persistent storage region is sized from the machine's RAM (about 20%), which
  # outgrew the container memory limit and got nodes OOM-killed. The Customer 360 data set is far below 1 GiB.
  storage {
    profiles = [ { name = default, engine = aipersist, sizeBytes = 1073741824 } ]
  }
}
